<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Doodle Words</title>
  <meta name="description" content="Read a word, draw it, and make a movie of your drawings. A reading game for first graders." />
  <meta name="theme-color" content="#f4efe4" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main id="app">
    <div class="book" id="book">
      <div class="spread" id="spread">

        <!-- WORKSPACE (sits underneath; revealed by the page flip) -->
        <section class="layer workspace" id="workspace" aria-label="Reading and drawing pages">
          <div class="paper left" id="wsLeft">
            <div class="ws-top">
              <span class="hello" id="hello">Hi!</span>
              <span class="stars" id="stars" aria-label="Words drawn"></span>
            </div>
            <div class="word-wrap">
              <div class="word" id="word" aria-live="polite"></div>
              <div class="word-tools">
                <button class="chip" id="hearWord" type="button"><span aria-hidden="true">🔊</span> Hear it</button>
                <button class="chip" id="soundOut" type="button"><span aria-hidden="true">👆</span> Sound it out</button>
              </div>
            </div>
            <p class="sentence" id="sentence"></p>
            <button class="btn done-btn corner-left" id="doneBtn" type="button">I'm done! <span aria-hidden="true">🎬</span></button>
            <span class="page-num left-num" id="numLeft">1</span>
          </div>

          <div class="paper right" id="wsRight">
            <div class="draw-head">
              <span class="draw-title">Draw it!</span>
              <div class="tools" role="toolbar" aria-label="Drawing tools">
                <button class="tool" data-size="6" type="button" aria-label="Thin crayon"><i style="width:6px;height:6px"></i></button>
                <button class="tool active" data-size="14" type="button" aria-label="Medium crayon"><i style="width:11px;height:11px"></i></button>
                <button class="tool" data-size="28" type="button" aria-label="Fat crayon"><i style="width:17px;height:17px"></i></button>
                <button class="tool" id="eraser" type="button" aria-label="Eraser" title="Eraser">🧽</button>
                <button class="tool" id="undo" type="button" aria-label="Undo" title="Undo">↩️</button>
                <button class="tool" id="clear" type="button" aria-label="Clear" title="Start over">🗑️</button>
              </div>
            </div>
            <div class="crayons" id="crayons" role="radiogroup" aria-label="Crayon colors"></div>
            <div class="canvas-wrap" id="canvasWrap">
              <canvas id="pad" width="1200" height="900" aria-label="Drawing box"></canvas>
            </div>
            <button class="btn next-btn corner-right" id="nextWord" type="button">Next <span aria-hidden="true">➜</span></button>
            <span class="page-num right-num" id="numRight">2</span>
          </div>
        </section>

        <!-- INTRO (on top; its right half flips over) -->
        <section class="layer intro" id="intro" aria-label="Welcome">
          <div class="paper left"></div>
          <div class="paper right"></div>
          <div class="stage" id="stage"></div>
          <form class="name-card" id="nameCard" autocomplete="off">
            <svg class="card-doodle d1" viewBox="0 0 80 100" aria-hidden="true">
              <circle cx="40" cy="22" r="14" fill="#ffe3c4" />
              <path d="M34 20 q3 -4 6 0 M43 20 q3 -4 6 0 M34 28 q6 6 12 0" />
              <path d="M40 36 L40 68 M40 68 L28 94 M40 68 L52 94 M40 46 L22 54 M40 46 L60 24" />
              <path d="M60 24 l6 -6 M60 24 l8 0" />
            </svg>
            <svg class="card-doodle d2" viewBox="0 0 90 100" aria-hidden="true">
              <circle cx="40" cy="22" r="14" fill="#c68e6b" />
              <path d="M26 16 q-12 -2 -10 10 M54 16 q12 -2 10 10" stroke="#3b2a20" stroke-width="7" />
              <path d="M34 21 l0 2 M46 21 l0 2 M34 28 q6 5 12 0" />
              <path d="M40 36 L28 72 L52 72 Z" fill="#ffd93d" />
              <path d="M34 72 L30 94 M46 72 L50 94 M36 44 L14 40 M44 44 L70 30" />
              <path d="M70 30 l10 -10 l2 12 z" fill="#ef5b5b" />
            </svg>
            <label for="nameInput" class="q">
              <span>What is your name?</span>
              <button class="say" id="sayQ" type="button" aria-label="Read the question to me">🔊</button>
            </label>
            <div class="name-line">
              <input id="nameInput" name="name" maxlength="16" placeholder="My name is…" spellcheck="false" autocapitalize="words" enterkeyhint="next" />
            </div>
          </form>
          <button class="btn next-btn corner-right" id="nameNext" type="button" form="nameCard">Next <span aria-hidden="true">➜</span></button>
          <button class="skip" id="skipIntro" type="button">skip ⏩</button>
        </section>

        <div class="seam" aria-hidden="true"></div>
      </div>
    </div>

    <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true" title="Sound on/off">🔈</button>
  </main>

  <!-- MOVIE -->
  <div class="movie" id="movie" hidden>
    <div class="movie-box" role="dialog" aria-modal="true" aria-labelledby="movieTitle">
      <h2 id="movieTitle">Your movie!</h2>
      <div class="screen">
        <canvas id="movieCanvas" width="1280" height="720"></canvas>
        <video id="movieVideo" playsinline controls hidden></video>
        <div class="making" id="making"><span>🎬</span> Making your movie…</div>
      </div>
      <div class="movie-actions" id="movieActions">
        <button class="btn" id="replay" type="button" disabled>▶ Watch again</button>
        <button class="btn green" id="saveVideo" type="button" disabled>⬇ Save movie</button>
        <button class="btn blue" id="saveDrawings" type="button">⬇ Save drawings</button>
        <button class="btn ghost" id="moreWords" type="button">✏️ Read more words</button>
      </div>
      <p class="movie-note" id="movieNote"></p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/words.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/pad.js"></script>
  <script src="js/movie.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
